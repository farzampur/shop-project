services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - shop_postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    restart: unless-stopped


  web:
    build: .
    
    image: shop-backend:latest

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      - db

    restart: unless-stopped


volumes:
  shop_postgres_data:
    external: true
  